
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เว็บไซต์ของฉัน</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #3498db;
            color: white;
            padding: 25px;
        }

        h1 {
            font-size: 32px;
        }

        .content {
            background-color: white;
            margin: 30px auto;
            padding: 25px;
            width: 70%;
            border-radius: 15px;
            box-shadow: 0 4px 10px #cccccc;
        }

        button {
            background-color: #2ecc71;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #27ae60;
        }

        footer {
            background-color: #34495e;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>ยินดีต้อนรับสู่เว็บไซต์ของฉัน</h1>
        <p>เว็บไซต์สร้างด้วย HTML และ CSS</p>
    </header>

    <div class="content">
        <h2>เกี่ยวกับเว็บไซต์</h2>
        <p>นี่คือเว็บไซต์ตัวอย่างสำหรับฝึกเขียน HTML</p>
        <button>คลิกที่นี่</button>
    </div>

    <footer>
        <p>จัดทำโดย นักเรียน | 2026</p>
    </footer>

</body>
</html>
